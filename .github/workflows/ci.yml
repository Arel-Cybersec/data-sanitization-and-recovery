name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitize: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y cmake libssl-dev
      - run: cmake -B build -DSANITIZE=${{ matrix.sanitize }} && cmake --build build
      - run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - run: cmake -B build -G Ninja && cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/erasecure.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: erasecure-windows-x64
          path: build/erasecure.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: erasecure-windows-x64
      - name: Publish erasecure.exe on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum erasecure.exe > erasecure.exe.sha256
          gh release create "${{ github.ref_name }}" erasecure.exe erasecure.exe.sha256 \
            --repo "${{ github.repository }}" --title "EraseCure ${{ github.ref_name }}" \
            --notes "Windows: download erasecure.exe and run it from PowerShell. Check the download with: Get-FileHash erasecure.exe (compare with erasecure.exe.sha256)."
